<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>researchLAB ofisi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Pixelify+Sans:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: playful but legible, a game screen you can actually monitor work on.
   IDEA: an isometric pixel-art office diorama, like a sim game's build view.
   PICTURE: the office scene itself, with agents walking, typing and handing off work.
   COLOUR and TYPE: teal walls, warm wood, one shirt colour per agent; Silkscreen + Pixelify for the game, Plex for panels.
   LAYOUT: office + team/feed/board on the left, two live terminals stacked on the right; stacks on narrow panes. */
:root{color-scheme:light dark;--bg:light-dark(#e6ece8,#0f1716);--panel:light-dark(#ffffff,#172220);--ink:light-dark(#13201d,#e4eeea);--mute:light-dark(#53645d,#93a7a0);--line:light-dark(#d2dcd6,#2a3a35);--teal:#2f6f6a;--accent:#e8590c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip}
.app{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding:clamp(14px,2vw,22px)}
.left{display:flex;flex-direction:column;gap:16px}.left>*{flex:none}
.right{display:grid;grid-template-rows:440px 440px;gap:14px}
@media(min-width:1100px){
  .app{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);height:100vh}
  .left{overflow:auto;padding-right:6px}
  .right{grid-template-rows:minmax(0,1fr) minmax(0,1fr);height:calc(100vh - 2*clamp(14px,2vw,22px))}
}
h1{font:400 clamp(26px,3vw,34px)/1.05 "Silkscreen",monospace;margin:0 0 4px;text-wrap:balance}
.lede{margin:0 0 12px;color:var(--mute);max-width:70ch;font-size:15px}
.term{display:grid;grid-template-rows:auto minmax(0,1fr);background:#0b1110;border:3px solid #0b1514;box-shadow:6px 6px 0 rgba(0,0,0,.25);min-height:0}
.th{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:#1a2a27;color:#e4eeea;font-size:14px}
.th b{font:400 14px "Silkscreen",monospace}
.th .sub{color:#93a7a0}
.th a{margin-left:auto;color:#9fd6e8;font-size:13px}
.tb{position:relative;min-height:0;overflow:hidden}
.tb iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0b1110}
.fake{margin:0;padding:12px 14px;height:100%;overflow:auto;color:#cfe3dc;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
.fake .p{color:#7ee0ff}.fake .m{color:#e8590c}.fake .n{color:#93a7a0}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.file{min-height:44px;padding:0 16px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);font:600 15px "IBM Plex Sans",sans-serif;cursor:pointer;display:inline-flex;align-items:center;box-shadow:3px 3px 0 var(--ink)}
button:active,.file:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible,.file:focus-within{outline:3px solid var(--accent);outline-offset:2px}
button.on{background:var(--ink);color:var(--panel)}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.src{display:block;font-size:14px;color:var(--mute);margin:6px 0 0 4px}
.badge{display:inline-block;vertical-align:middle;font:400 13px/1 "Silkscreen",monospace;padding:4px 6px 3px;background:var(--accent);color:#fff;letter-spacing:.04em}
[hidden]{display:none!important}
.scene{position:relative;aspect-ratio:352/250;background:#232b2f;border:3px solid #0b1514;box-shadow:6px 6px 0 rgba(0,0,0,.25);overflow:hidden}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#ov{position:absolute;inset:0;pointer-events:none}
.bub{position:absolute;transform:translate(-50%,-100%);max-width:230px;width:max-content;background:#fffdf6;color:#161616;border:2px solid #161616;padding:4px 8px;font:14px/1.3 "Pixelify Sans",monospace;box-shadow:3px 3px 0 rgba(0,0,0,.35);transition:opacity .25s;opacity:0}
.bub::after{content:"";position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);border:5px solid transparent;border-top-color:#161616}
.bub.show{opacity:1}
.tag{position:absolute;transform:translate(-50%,3px);font:13px "Silkscreen",monospace;color:#fff;text-shadow:1px 1px 0 #000,-1px 0 0 #000;white-space:nowrap;opacity:.9}
.small .tag{display:none}
.side{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.kbc{grid-column:1/-1}
.card{background:var(--panel);border:2px solid var(--line);padding:14px 16px}
.card h2{font:400 16px "Silkscreen",monospace;margin:0 0 10px}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}
.row{display:grid;grid-template-columns:12px minmax(0,1fr) 70px 54px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:0}
.dot{width:12px;height:12px;display:inline-block;border:2px solid rgba(0,0,0,.35)}
.st{display:block;font-size:13px;color:var(--mute)}
.bar{height:8px;background:var(--line)}.bar i{display:block;height:100%}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:420px){.kb{grid-template-columns:repeat(2,minmax(0,1fr))}}
.col h3{font:600 13px "IBM Plex Sans",sans-serif;margin:0 0 6px;color:var(--mute)}
.tk{font-size:13px;line-height:1.35;border:1px solid var(--line);padding:6px;margin-bottom:6px;background:var(--bg)}
.tk b{display:flex;gap:6px;align-items:center;font-size:13px}
.tk .dot{width:9px;height:9px;border-width:1px}
.empty{font-size:13px;color:var(--mute)}
#feed{list-style:none;margin:0;padding:0;max-height:330px;overflow:auto;font-size:13px}
#feed li{display:grid;grid-template-columns:62px 92px minmax(0,1fr);gap:6px;padding:4px 0;border-top:1px solid var(--line)}
#feed time{color:var(--mute);font-variant-numeric:tabular-nums}
#feed .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#feed .ev{color:var(--mute)}
@media(max-width:600px){#feed li{grid-template-columns:56px minmax(0,1fr)}#feed .msg{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){.bub{transition:none}}
</style>
</head>
<body>
<div class="app">
<div class="left">
<header>
  <h1>researchLAB ofisi <span class="badge" id="demobadge" hidden>DEMO</span></h1>
  <p class="lede" id="lede">Agent'ların hook olaylarından beslenen canlı ofis.</p>
  <div class="ctrl" id="democtrl" hidden>
    <button id="play">Duraklat</button>
    <button data-sp="1" class="on">1x</button><button data-sp="2">2x</button><button data-sp="4">4x</button>
    <label class="file">events.jsonl yükle<input type="file" id="file" accept=".jsonl,.json,.txt"></label>
    <button id="reset">Demoyu baştan oynat</button>
  </div>
  <span class="src" id="src">Kaynak: bağlanıyor…</span>
</header>
  <div class="scene" id="scene"><canvas id="cv" width="352" height="250"></canvas><div id="ov"></div></div>
  <div class="side">
    <section class="card"><h2>Ekip</h2><div id="team"></div><p class="note" id="toknote"></p></section>
    <section class="card"><h2>Canlı olay akışı</h2><ol id="feed"></ol></section>
    <section class="card kbc"><h2>Görev panosu</h2><div class="kb" id="kb"></div></section>
  </div>
</div>
<aside class="right">
  <section class="term"><div class="th"><span class="dot" style="background:#e8590c"></span><b>Terminal 1</b><span class="sub">Manager · claude</span><a id="l1" href="#" target="_blank" rel="noopener">Yeni sekmede aç</a></div><div class="tb" id="t1"></div></section>
  <section class="term"><div class="th"><span class="dot" style="background:#7ee0ff"></span><b>Terminal 2</b><span class="sub">serbest kabuk</span><a id="l2" href="#" target="_blank" rel="noopener">Yeni sekmede aç</a></div><div class="tb" id="t2"></div></section>
</aside>
</div>
<script type="module" src="static/main.js"></script>
</body>
</html>
